<text x="36" y="64" fill="#0f172a" font-size="26" font-family="system-ui,sans-serif" font-weight="700">Glossary card</text>
<text x="36" y="92" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Token: what the model reads.</text><text x="36" y="128" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Chunk: what you index.</text><text x="36" y="164" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Tool: a function with a schema.</text><text x="36" y="200" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Channel: voice, chat, or message.</text><text x="36" y="236" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Refusal: a successful silence.</text><text x="36" y="272" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Confirm before relying: the honesty mark.</text><text x="36" y="308" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Sources and go deeper</text><text x="36" y="344" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Vaswani and co-authors, Attention Is All You Need, 2017 (paper)</text><text x="36" y="380" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="408" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://arxiv.org/abs/1706.03762</text><text x="36" y="436" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">RFC 9110, HTTP Semantics (spec)</text><text x="36" y="472" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="500" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://www.rfc-editor.org/rfc/rfc9110</text><text x="36" y="528" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">RFC 8259, The JSON Data Interchange Format (spec)</text><text x="36" y="564" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="592" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://www.rfc-editor.org/rfc/rfc8259</text><text x="36" y="620" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Model Context Protocol specification, 2025-06-18 (spec)</text><text x="36" y="656" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="684" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://modelcontextprotocol.io/specification/2025-06-18</text><text x="36" y="712" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Lewis and co-authors, Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks, 2020 (paper)</text><text x="36" y="748" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="776" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://arxiv.org/abs/2005.11401</text><text x="36" y="804" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Large language model — Wikipedia (wikipedia)</text><text x="36" y="840" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="868" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://en.wikipedia.org/wiki/Large_language_model</text>
