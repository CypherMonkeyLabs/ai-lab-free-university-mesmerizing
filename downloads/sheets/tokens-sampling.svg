<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 766" role="img">
<title>Tokens and sampling</title>
<rect width="800" height="766" fill="#fff7ed"/>
<rect x="20" y="20" width="760" height="726" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="36" y="64" fill="#0f172a" font-size="26" font-family="system-ui,sans-serif" font-weight="700">Tokens and sampling</text>
<text x="36" y="92" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">A token is not always a word.</text><text x="36" y="128" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">A space split is a toy. Label it.</text><text x="36" y="164" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Temperature is not a truth dial.</text><text x="36" y="200" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Record temperature, max tokens, and the stop.</text><text x="36" y="236" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Confirm a model card before you quote a window.</text><text x="36" y="272" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Sources and go deeper</text><text x="36" y="308" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Vaswani and co-authors, Attention Is All You Need, 2017 (paper)</text><text x="36" y="344" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="372" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://arxiv.org/abs/1706.03762</text><text x="36" y="400" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Brown and co-authors, Language Models are Few-Shot Learners, 2020 (paper)</text><text x="36" y="436" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="464" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://arxiv.org/abs/2005.14165</text><text x="36" y="492" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Attention Is All You Need — Wikipedia (wikipedia)</text><text x="36" y="528" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="556" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://en.wikipedia.org/wiki/Attention_Is_All_You_Need</text><text x="36" y="584" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Large language model — Wikipedia (wikipedia)</text><text x="36" y="620" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="648" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://en.wikipedia.org/wiki/Large_language_model</text>
