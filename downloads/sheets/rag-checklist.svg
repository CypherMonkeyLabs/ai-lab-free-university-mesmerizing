<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 710" role="img">
<title>RAG checklist</title>
<rect width="800" height="710" fill="#fff7ed"/>
<rect x="20" y="20" width="760" height="670" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="36" y="64" fill="#0f172a" font-size="26" font-family="system-ui,sans-serif" font-weight="700">RAG checklist</text>
<text x="36" y="92" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Write the question.</text><text x="36" y="128" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Retrieve passages.</text><text x="36" y="164" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Read them before you answer.</text><text x="36" y="200" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Quote or refuse.</text><text x="36" y="236" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">If notes disagree, say so.</text><text x="36" y="272" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Date a stale note.</text><text x="36" y="308" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Sources and go deeper</text><text x="36" y="344" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Lewis and co-authors, Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks, 2020 (paper)</text><text x="36" y="380" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="408" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://arxiv.org/abs/2005.11401</text><text x="36" y="436" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Karpukhin and co-authors, Dense Passage Retrieval for Open-Domain Question Answering, 2020 (paper)</text><text x="36" y="472" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="500" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://arxiv.org/abs/2004.04906</text><text x="36" y="528" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Retrieval-augmented generation — Wikipedia (wikipedia)</text><text x="36" y="564" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="592" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://en.wikipedia.org/wiki/Retrieval-augmented_generation</text>
