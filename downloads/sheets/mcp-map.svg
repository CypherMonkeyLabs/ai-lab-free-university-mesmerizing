<text x="36" y="92" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Host: the app a person uses.</text><text x="36" y="128" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Client: the protocol speaker.</text><text x="36" y="164" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Server: tools, resources, or prompts.</text><text x="36" y="200" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Consent names the action.</text><text x="36" y="236" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Confirm the spec revision.</text><text x="36" y="272" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">This lab opens no port.</text><text x="36" y="308" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Sources and go deeper</text><text x="36" y="344" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Model Context Protocol specification, 2025-06-18 (spec)</text><text x="36" y="380" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="408" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://modelcontextprotocol.io/specification/2025-06-18</text><text x="36" y="436" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">What is the Model Context Protocol (MCP)? (spec)</text><text x="36" y="472" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="500" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://modelcontextprotocol.io/docs/2026-07-28/getting-started/intro</text><text x="36" y="528" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Model Context Protocol organization on GitHub (community)</text><text x="36" y="564" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="592" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://github.com/modelcontextprotocol</text><text x="36" y="620" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">RFC 8259, The JSON Data Interchange Format (spec)</text><text x="36" y="656" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="684" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://www.rfc-editor.org/rfc/rfc8259</text><text x="36" y="712" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Model Context Protocol — Wikipedia (wikipedia)</text><text x="36" y="748" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="776" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://en.wikipedia.org/wiki/Model_Context_Protocol</text>
