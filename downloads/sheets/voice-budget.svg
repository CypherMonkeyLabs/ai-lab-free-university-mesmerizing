<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 838" role="img">
<title>Voice budget</title>
<rect width="800" height="838" fill="#fff7ed"/>
<rect x="20" y="20" width="760" height="798" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="36" y="64" fill="#0f172a" font-size="26" font-family="system-ui,sans-serif" font-weight="700">Voice budget</text>
<text x="36" y="92" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Hear, decide, speak.</text><text x="36" y="128" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Speech is not the language model.</text><text x="36" y="164" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Label millisecond figures as a fixture.</text><text x="36" y="200" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">This page states no SLA.</text><text x="36" y="236" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">The slow stage is the one to study.</text><text x="36" y="272" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">The tool cap still applies.</text><text x="36" y="308" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Sources and go deeper</text><text x="36" y="344" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">MDN Web Docs, Web Speech API (community)</text><text x="36" y="380" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="408" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://developer.mozilla.org/en-US/docs/Web/API/Web_Speech_API</text><text x="36" y="436" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Web Speech API community draft (community)</text><text x="36" y="472" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="500" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://webaudio.github.io/web-speech-api/</text><text x="36" y="528" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">W3C /TR/speech-api/ (spec) confirm</text><text x="36" y="564" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">This URL returned 404 on 2026-10. The community draft above is the page that opened.</text><text x="36" y="600" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="628" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://www.w3.org/TR/speech-api/</text><text x="36" y="656" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Speech synthesis — Wikipedia (wikipedia)</text><text x="36" y="692" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="720" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://en.wikipedia.org/wiki/Speech_synthesis</text>
