<text x="36" y="92" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Hear, decide, speak.</text><text x="36" y="128" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Speech is not the language model.</text><text x="36" y="164" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Label millisecond figures as a fixture.</text><text x="36" y="200" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">This page states no SLA.</text><text x="36" y="236" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">The slow stage is the one to study.</text><text x="36" y="272" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">The tool cap still applies.</text>
