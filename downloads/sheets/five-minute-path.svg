<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img">
<title>Five-minute path</title>
<rect width="800" height="420" fill="#fff7ed"/>
<rect x="20" y="20" width="760" height="380" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="36" y="64" fill="#0f172a" font-size="26" font-family="system-ui,sans-serif" font-weight="700">Five-minute path</text>
<text x="36" y="92" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Open Learn and read only the opening room of each track.</text><text x="36" y="128" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Export one SVG.</text><text x="36" y="164" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Answer that room&#x27;s three checks.</text><text x="36" y="200" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Stop. The full course can wait.</text><text x="36" y="236" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Progress stays in this browser.</text>
<text x="24" y="364" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">Independent, free, learning-only student project. Not affiliated or endorsed. Trademarks belong to their owners. Nothing sold.</text><text x="24" y="386" fill="#0c4a6e" font-size="13" font-family="system-ui,sans-serif">https://cyphermonkeylabs.com  ·  https://github.com/CypherMonkeyLabs  ·  https://linktr.ee/cypherMonkey</text>
