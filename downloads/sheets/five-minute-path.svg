<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 674" role="img">
<title>Five-minute path</title>
<rect width="800" height="674" fill="#fff7ed"/>
<rect x="20" y="20" width="760" height="634" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="36" y="64" fill="#0f172a" font-size="26" font-family="system-ui,sans-serif" font-weight="700">Five-minute path</text>
<text x="36" y="92" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Open Learn and read only the opening room of each track.</text><text x="36" y="128" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Export one SVG.</text><text x="36" y="164" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Answer that room&#x27;s three checks.</text><text x="36" y="200" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Stop. The full course can wait.</text><text x="36" y="236" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Progress stays in this browser.</text><text x="36" y="272" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Sources and go deeper</text><text x="36" y="308" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">NIST AI Risk Management Framework (spec)</text><text x="36" y="344" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="372" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://www.nist.gov/itl/ai-risk-management-framework</text><text x="36" y="400" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">W3C, Web Content Accessibility Guidelines 2.2 (spec)</text><text x="36" y="436" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="464" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://www.w3.org/TR/WCAG22/</text><text x="36" y="492" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Web accessibility — Wikipedia (wikipedia)</text><text x="36" y="528" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="556" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://en.wikipedia.org/wiki/Web_accessibility</text>
