<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 802" role="img">
<title>Agent loop</title>
<rect width="800" height="802" fill="#fff7ed"/>
<rect x="20" y="20" width="760" height="762" rx="18" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="36" y="64" fill="#0f172a" font-size="26" font-family="system-ui,sans-serif" font-weight="700">Agent loop</text>
<text x="36" y="92" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Name the goal.</text><text x="36" y="128" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Validate tool arguments.</text><text x="36" y="164" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Set a step cap.</text><text x="36" y="200" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Stop when a result repeats.</text><text x="36" y="236" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">A person approves an undo-hard action.</text><text x="36" y="272" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Keep the trace.</text><text x="36" y="308" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Sources and go deeper</text><text x="36" y="344" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Yao and co-authors, ReAct: Synergizing Reasoning and Acting in Language Models, 2022 (paper)</text><text x="36" y="380" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="408" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://arxiv.org/abs/2210.03629</text><text x="36" y="436" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Schick and co-authors, Toolformer: Language Models Can Teach Themselves to Use Tools, 2023 (paper)</text><text x="36" y="472" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="500" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://arxiv.org/abs/2302.04761</text><text x="36" y="528" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Anthropic, Building effective agents (vendor)</text><text x="36" y="564" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="592" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://www.anthropic.com/engineering/building-effective-agents</text><text x="36" y="620" fill="#0f172a" font-size="18" font-family="system-ui,sans-serif">Large language model — Wikipedia (wikipedia)</text><text x="36" y="656" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">last checked 2026-10</text><text x="36" y="684" fill="#0f172a" font-size="14" font-family="system-ui,sans-serif">https://en.wikipedia.org/wiki/Large_language_model</text>
