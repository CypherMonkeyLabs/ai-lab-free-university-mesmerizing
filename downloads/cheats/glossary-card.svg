<svg xmlns="http://www.w3.org/2000/svg" width="900" height="698" viewBox="0 0 900 698"><rect width="900" height="698" fill="#070b16"/><text x="36" y="48" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="28">Glossary card</text><text x="36" y="86" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Token: a chunk the model reads or writes. Not always a word.</text><text x="36" y="114" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Context window: one budget shared by instructions, sources, and the answer.</text><text x="36" y="142" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Retrieval: find a span, then generate. Cite the id.</text><text x="36" y="170" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Tool schema: name, arguments, and your handler.</text><text x="36" y="198" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Eval gate: quality, safety, latency, cost.</text><text x="36" y="226" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">The full glossary is the Glossary track in the campus.</text><text x="36" y="254" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Sources and go deeper</text><text x="36" y="282" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Vaswani and co-authors, Attention Is All You Need, 2017 (paper)</text><text x="36" y="310" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="338" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://arxiv.org/abs/1706.03762</text><text x="36" y="366" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Lewis and co-authors, Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks, 20</text><text x="36" y="394" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="422" fill="#e7f6ff" font-family="system-ui,sans-serif" 