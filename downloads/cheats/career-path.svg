<svg xmlns="http://www.w3.org/2000/svg" width="900" height="670" viewBox="0 0 900 670"><rect width="900" height="670" fill="#070b16"/><text x="36" y="48" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="28">Career path</text><text x="36" y="86" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Explain a token, a window, and a sample without a product name.</text><text x="36" y="114" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Build a grounded assistant on notes you may use, with one read-only tool.</text><text x="36" y="142" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Prove ten tasks: retrieval, safety, latency, and cost.</text><text x="36" y="170" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Interview drills ask for the mechanism, the control, and the evidence.</text><text x="36" y="198" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">This sheet is not a certificate. Vendor exams are read from that vendor&#x27;s current page.</text><text x="36" y="226" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Sources and go deeper</text><text x="36" y="254" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Vaswani and co-authors, Attention Is All You Need, 2017 (paper)</text><text x="36" y="282" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="310" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://arxiv.org/abs/1706.03762</text><text x="36" y="338" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Lewis and co-authors, Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks, 20</text><text x="36" y="366" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="394" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://arxiv.org/abs/2005.11401</text><text x="36" y="42