<svg xmlns="http://www.w3.org/2000/svg" width="900" height="586" viewBox="0 0 900 586"><rect width="900" height="586" fill="#070b16"/><text x="36" y="48" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="28">Migration and cutover</text><text x="36" y="86" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Inventory the old bot&#x27;s answers and their allowed sources.</text><text x="36" y="114" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Write ten tasks, including a refusal.</text><text x="36" y="142" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Shadow mode: users still see the old bot.</text><text x="36" y="170" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Limited audience, kill switch tested, then a wider cut.</text><text x="36" y="198" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Retire the old bot only after its tasks stay in the eval set.</text><text x="36" y="226" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Sources and go deeper</text><text x="36" y="254" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">NIST AI Risk Management Framework (spec)</text><text x="36" y="282" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="310" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://www.nist.gov/itl/ai-risk-management-framework</text><text x="36" y="338" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">OWASP Top 10 for Large Language Model Applications (community)</text><text x="36" y="366" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="394" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://owasp.org/projects/top-10-for-large-language-model-applications</text><text x="36" y="422" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Large la