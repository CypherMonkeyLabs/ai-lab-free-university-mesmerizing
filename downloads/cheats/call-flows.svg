<svg xmlns="http://www.w3.org/2000/svg" width="900" height="754" viewBox="0 0 900 754"><rect width="900" height="754" fill="#070b16"/><text x="36" y="48" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="28">Call and data flows</text><text x="36" y="86" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Voice, study order: caller, SIP, media, ASR, turn, retrieval, model, TTS, media, caller.</text><text x="36" y="114" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Emergency leaves that list. The voice platform&#x27;s emergency path is the path.</text><text x="36" y="142" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Retrieval, study order: documents you may store, chunks, one embedding id, retrieve, reran</text><text x="36" y="170" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Agent, study order: goal, schema, permission, tool result, trace, stop.</text><text x="36" y="198" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">A person sits on send, pay, delete, and cutover.</text><text x="36" y="226" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Sources and go deeper</text><text x="36" y="254" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Lewis and co-authors, Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks, 20</text><text x="36" y="282" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="310" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://arxiv.org/abs/2005.11401</text><text x="36" y="338" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Yao and co-authors, ReAct: Synergizing Reasoning and Acting in Language Models, 2022 (pape</text><text x="36" y="366" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="394" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://arxiv.org/abs/2210.03629</text><text x="36" y="422" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">MDN Web Docs, Web Speech API (community)</text><text x="36" y="450" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="478" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://developer.mozilla.org/en-US/docs/Web/API/Web_Speech_API</text><text x="36" y="506" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Retrieval-augmented generation — Wikipedia (wikipedia)</text><text x="36" y="534" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="562" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://en.wikipedia.org/wiki/Retrieval-augmented_generation</text><text x="36" y="590" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Speech recognition — Wikipedia (wikipedia)</text><text x="36" y="618" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="646" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://en.wikipedia.org/wiki/Speech_recognition</text><text x="36" y="710" fill="#93b4c9" font-family="system-ui,sans-serif" font-size="14">cyphermonkeylabs.com · independent study sheet</text></svg>