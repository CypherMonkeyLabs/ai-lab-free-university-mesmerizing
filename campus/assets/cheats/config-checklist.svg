<svg xmlns="http://www.w3.org/2000/svg" width="900" height="334" viewBox="0 0 900 334"><rect width="900" height="334" fill="#070b16"/><text x="36" y="48" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="28">Configuration checklist</text><text x="36" y="86" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Pin the model id and the embedding id.</text><text x="36" y="114" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Keep the key out of the repository.</text><text x="36" y="142" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Bind a local runner to loopback until you mean to share it.</text><text x="36" y="170" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Set a timeout and a retry cap that cannot double-send.</text><text x="36" y="198" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Log ids and counts. Drop the key and the raw private text.</text><text x="36" y="226" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Name the kill switch and the old path.</text><text x="36" y="290" fill="#93b4c9" font-family="system-ui,sans-serif" font-size="14">cyphermonkeylabs.com · independent study sheet</text></svg>