<svg xmlns="http://www.w3.org/2000/svg" width="900" height="334" viewBox="0 0 900 334"><rect width="900" height="334" fill="#070b16"/><text x="36" y="48" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="28">Glossary card</text><text x="36" y="86" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Token: a chunk the model reads or writes. Not always a word.</text><text x="36" y="114" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Context window: one budget shared by instructions, sources, and the answer.</text><text x="36" y="142" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Retrieval: find a span, then generate. Cite the id.</text><text x="36" y="170" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Tool schema: name, arguments, and your handler.</text><text x="36" y="198" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Eval gate: quality, safety, latency, cost.</text><text x="36" y="226" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">The full glossary is the Glossary track in the campus.</text><text x="36" y="290" fill="#93b4c9" font-family="system-ui,sans-serif" font-size="14">cyphermonkeylabs.com · independent study sheet</text></svg>