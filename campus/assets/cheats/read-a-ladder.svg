<svg xmlns="http://www.w3.org/2000/svg" width="900" height="502" viewBox="0 0 900 502"><rect width="900" height="502" fill="#070b16"/><text x="36" y="48" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="28">How to read a ladder</text><text x="36" y="86" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Columns are the parties. Time runs downward.</text><text x="36" y="114" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">An arrow is one message. The label is the study claim, not a packet capture.</text><text x="36" y="142" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">The moving dot is a reading aid. It is not traffic from a live system.</text><text x="36" y="170" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Emergency arrows stop on the voice platform.</text><text x="36" y="198" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">The room diagrams are the 38 study-draft files. They were not redrawn from a fresh vendor </text><text x="36" y="226" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Sources and go deeper</text><text x="36" y="254" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">RFC 3261, SIP: Session Initiation Protocol (spec)</text><text x="36" y="282" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="310" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://www.rfc-editor.org/rfc/rfc3261</text><text x="36" y="338" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">HTTP — Wikipedia (wikipedia)</text><text x="36" y="366" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="394" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://en.wikipedia.org/wiki/HTTP</text><text x="36" y="458" fill="#93b4c9" font-family="system-ui,sans-serif" font-size="14">cyphermonkeylabs.com · independent study sheet</text></svg>