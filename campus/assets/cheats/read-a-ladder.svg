<svg xmlns="http://www.w3.org/2000/svg" width="900" height="306" viewBox="0 0 900 306"><rect width="900" height="306" fill="#070b16"/><text x="36" y="48" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="28">How to read a ladder</text><text x="36" y="86" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Columns are the parties. Time runs downward.</text><text x="36" y="114" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">An arrow is one message. The label is the study claim, not a packet capture.</text><text x="36" y="142" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">The moving dot is a reading aid. It is not traffic from a live system.</text><text x="36" y="170" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Emergency arrows stop on the voice platform.</text><text x="36" y="198" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">The room diagrams are the 38 study-draft files. They were not redrawn from a fresh vendor </text><text x="36" y="262" fill="#93b4c9" font-family="system-ui,sans-serif" font-size="14">cyphermonkeylabs.com · independent study sheet</text></svg>