<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1118" viewBox="0 0 900 1118"><rect width="900" height="1118" fill="#070b16"/><text x="36" y="48" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="28">Ports and protocols</text><text x="36" y="86" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Study matrix. Confirm every listener on the host you run.</text><text x="36" y="114" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">443 TCP — HTTPS to a model API. Confirm the vendor host.</text><text x="36" y="142" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">53 UDP/TCP — DNS.</text><text x="36" y="170" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">4317 TCP — OTLP gRPC. OpenTelemetry default. Not re-fetched 2026-10-15.</text><text x="36" y="198" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">4318 TCP — OTLP HTTP. OpenTelemetry default. Not re-fetched 2026-10-15.</text><text x="36" y="226" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">11434 TCP — Ollama&#x27;s published loopback default. Not re-fetched 2026-10-15.</text><text x="36" y="254" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">5060 UDP/TCP — SIP, RFC 3261. Confirm the listener.</text><text x="36" y="282" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">5061 TCP — SIP over TLS, commonly assigned. Confirm in the IANA registry.</text><text x="36" y="310" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">RTP — a range you configure, not one universal port.</text><text x="36" y="338" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">MCP stdio — no port. Remote MCP is HTTP on a port you choose.</text><text x="36" y="366" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Sources: RFC 3261, OpenTelemetry OTLP spec, MCP specification 2025-06-18, Ollama docs, IAN</text><text x="36" y="394" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Sources and go deeper</text><text x="36" y="422" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">RFC 3261, SIP: Session Initiation Protocol (spec)</text><text x="36" y="450" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="478" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://www.rfc-editor.org/rfc/rfc3261</text><text x="36" y="506" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">OpenTelemetry OTLP specification (spec)</text><text x="36" y="534" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="562" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://opentelemetry.io/docs/specs/otlp/</text><text x="36" y="590" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">IANA service name and port number registry (spec)</text><text x="36" y="618" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="646" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xht</text><text x="36" y="674" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Model Context Protocol specification, 2025-06-18 (spec)</text><text x="36" y="702" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="730" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://modelcontextprotocol.io/specification/2025-06-18</text><text x="36" y="758" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">RFC 9110, HTTP Semantics (spec)</text><text x="36" y="786" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="814" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://www.rfc-editor.org/rfc/rfc9110</text><text x="36" y="842" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Ollama repository (community) confirm</text><text x="36" y="870" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">The response on 2026-10 did not include a readable project title.</text><text x="36" y="898" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="926" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://github.com/ollama/ollama</text><text x="36" y="954" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">HTTP — Wikipedia (wikipedia)</text><text x="36" y="982" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="1010" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://en.wikipedia.org/wiki/HTTP</text><text x="36" y="1074" fill="#93b4c9" font-family="system-ui,sans-serif" font-size="14">cyphermonkeylabs.com · independent study sheet</text></svg>