<svg xmlns="http://www.w3.org/2000/svg" width="900" height="698" viewBox="0 0 900 698"><rect width="900" height="698" fill="#070b16"/><text x="36" y="48" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="28">Troubleshooting tree</text><text x="36" y="86" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">No trace: stop and add one.</text><text x="36" y="114" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Wrong fact: was the span in the pack? If not, refuse or fix the index.</text><text x="36" y="142" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Tool error: the model is quoting your handler.</text><text x="36" y="170" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Should have refused: the gate failed, not the tone.</text><text x="36" y="198" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Slow phone turn: time ASR, model, and TTS separately.</text><text x="36" y="226" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Change one thing. Rescore the same tasks.</text><text x="36" y="254" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Sources and go deeper</text><text x="36" y="282" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Lewis and co-authors, Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks, 20</text><text x="36" y="310" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="338" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://arxiv.org/abs/2005.11401</text><text x="36" y="366" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">NIST AI Risk Management Framework (spec)</text><text x="36" y="394" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="422" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://www.nist.gov/itl/ai-risk-management-framework</text><text x="36" y="450" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">MDN Web Docs, Web Speech API (community)</text><text x="36" y="478" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="506" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://developer.mozilla.org/en-US/docs/Web/API/Web_Speech_API</text><text x="36" y="534" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">Retrieval-augmented generation — Wikipedia (wikipedia)</text><text x="36" y="562" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">last checked 2026-10</text><text x="36" y="590" fill="#e7f6ff" font-family="system-ui,sans-serif" font-size="16">https://en.wikipedia.org/wiki/Retrieval-augmented_generation</text><text x="36" y="654" fill="#93b4c9" font-family="system-ui,sans-serif" font-size="14">cyphermonkeylabs.com · independent study sheet</text></svg>