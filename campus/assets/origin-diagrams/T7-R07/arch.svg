<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img">
<title>Five jobs around one contact</title>
<desc>The route stays in the platform. Summary, quality review, and forecast are later readers. They do not own the call.</desc>
<rect width="1000" height="240" fill="#0e131b"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#7eb6ff"/></marker></defs>
<rect x="16" y="58" width="140" height="120" rx="12" fill="#171d27" stroke="#7eb6ff"/>
<text x="86" y="100" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Caller</text>
<text x="86" y="122" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">voice or chat</text>
<path d="M156 118 H176" stroke="#7eb6ff" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="178" y="58" width="140" height="120" rx="12" fill="#171d27" stroke="#7eb6ff"/>
<text x="248" y="100" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Platform</text>
<text x="248" y="122" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">still routes</text>
<path d="M318 118 H338" stroke="#7eb6ff" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="340" y="28" width="150" height="80" rx="12" fill="#171d27" stroke="#7eb6ff"/>
<text x="415" y="62" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Virtual agent</text>
<text x="415" y="82" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">caller hears this</text>
<rect x="340" y="128" width="150" height="80" rx="12" fill="#171d27" stroke="#7eb6ff"/>
<text x="415" y="162" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Human + assist</text>
<text x="415" y="182" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">human owns the call</text>
<path d="M490 68 H520" stroke="#7eb6ff" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M490 168 H520" stroke="#7eb6ff" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="522" y="78" width="150" height="80" rx="12" fill="#171d27" stroke="#e4b15a"/>
<text x="597" y="112" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Draft summary</text>
<text x="597" y="132" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">human edits</text>
<path d="M672 118 H700" stroke="#7eb6ff" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="702" y="28" width="140" height="80" rx="12" fill="#171d27" stroke="#7eb6ff"/>
<text x="772" y="62" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Quality</text>
<text x="772" y="82" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">scores later</text>
<rect x="702" y="128" width="140" height="80" rx="12" fill="#171d27" stroke="#7eb6ff"/>
<text x="772" y="162" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Forecast</text>
<text x="772" y="182" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">volume, not prose</text>
<rect x="860" y="78" width="124" height="80" rx="12" fill="#171d27" stroke="#3ecf8e"/>
<text x="922" y="112" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Host</text>
<text x="922" y="132" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">executes tools</text>
<path d="M842 68 H858" stroke="#3ecf8e" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
