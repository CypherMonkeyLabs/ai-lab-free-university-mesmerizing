<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img">
<title>A tool result is an input, then a host decision</title>
<desc>The model may be persuaded by a tool result. The host still checks the cap and can deny the call.</desc>
<rect width="1000" height="280" fill="#0e131b"/>
<defs><marker id="s" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#7eb6ff"/></marker></defs>
<text x="90" y="28" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">Caller</text>
<text x="280" y="28" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">Host</text>
<text x="490" y="28" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">Model</text>
<text x="720" y="28" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">Tool</text>
<text x="900" y="28" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">Trace</text>
<line x1="90" y1="40" x2="90" y2="260" stroke="#2a3344"/>
<line x1="280" y1="40" x2="280" y2="260" stroke="#2a3344"/>
<line x1="490" y1="40" x2="490" y2="260" stroke="#2a3344"/>
<line x1="720" y1="40" x2="720" y2="260" stroke="#2a3344"/>
<line x1="900" y1="40" x2="900" y2="260" stroke="#2a3344"/>
<path d="M90 60 H490" stroke="#7eb6ff" stroke-width="1.4" marker-end="url(#s)"/>
<text x="290" y="54" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">utterance</text>
<path d="M490 96 H280" stroke="#7eb6ff" stroke-width="1.4" marker-end="url(#s)"/>
<text x="300" y="90" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">tool request</text>
<path d="M280 132 H720" stroke="#e4b15a" stroke-width="1.4" marker-end="url(#s)"/>
<text x="400" y="126" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#e4b15a">host checks the cap</text>
<path d="M720 168 H490" stroke="#7eb6ff" stroke-width="1.4" marker-end="url(#s)"/>
<text x="520" y="162" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">result is untrusted text</text>
<path d="M490 204 H280" stroke="#7eb6ff" stroke-width="1.4" marker-end="url(#s)"/>
<text x="300" y="198" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">second request</text>
<path d="M280 240 H900" stroke="#7eb6ff" stroke-width="1.4" marker-end="url(#s)"/>
<text x="460" y="234" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">deny or one commit, then the span</text>
</svg>
