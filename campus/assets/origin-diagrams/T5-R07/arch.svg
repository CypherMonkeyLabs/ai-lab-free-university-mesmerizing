<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img">
<title>Offline set, live sample, and the host that can deny</title>
<desc>A golden set runs before deploy. A sample of traces runs in operation. Neither one executes a tool. The host does.</desc>
<rect width="1000" height="260" fill="#0e131b"/>
<defs><marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#7eb6ff"/></marker></defs>
<rect x="20" y="36" width="200" height="188" rx="12" fill="#171d27" stroke="#7eb6ff"/>
<text x="120" y="68" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Offline set</text>
<text x="120" y="92" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">named rows</text>
<text x="120" y="112" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">pass rule first</text>
<text x="120" y="132" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">pinned prompt</text>
<text x="120" y="152" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">pinned model</text>
<text x="120" y="184" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#e4b15a">before deploy</text>
<path d="M220 130 H268" stroke="#7eb6ff" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="270" y="36" width="200" height="188" rx="12" fill="#171d27" stroke="#7eb6ff"/>
<text x="370" y="68" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Same rule</text>
<text x="370" y="96" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">judge is a sample</text>
<text x="370" y="116" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">not a gold label</text>
<text x="370" y="148" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">swap order</text>
<text x="370" y="168" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">prefer the short truth</text>
<text x="370" y="200" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#e4b15a">money stays a rule</text>
<path d="M470 90 H518" stroke="#7eb6ff" stroke-width="1.5" marker-end="url(#g)"/>
<path d="M470 170 H518" stroke="#7eb6ff" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="520" y="28" width="200" height="100" rx="12" fill="#171d27" stroke="#7eb6ff"/>
<text x="620" y="64" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Live sample</text>
<text x="620" y="88" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">while in operation</text>
<rect x="520" y="144" width="200" height="88" rx="12" fill="#171d27" stroke="#e4b15a"/>
<text x="620" y="178" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Host deny</text>
<text x="620" y="202" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">tool checks the cap</text>
<path d="M720 78 H768" stroke="#7eb6ff" stroke-width="1.5" marker-end="url(#g)"/>
<path d="M720 188 H768" stroke="#7eb6ff" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="770" y="70" width="210" height="120" rx="12" fill="#171d27" stroke="#7eb6ff"/>
<text x="875" y="108" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Trace</text>
<text x="875" y="132" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">chat · retrieval</text>
<text x="875" y="152" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">execute_tool</text>
<text x="875" y="172" text-anchor="middle" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">pin the commit</text>
</svg>
