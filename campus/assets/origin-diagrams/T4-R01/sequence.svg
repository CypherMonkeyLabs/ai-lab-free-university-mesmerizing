anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">10. result or error</text><line x1="326.6666666666667" y1="498" x2="490.0" y2="498" stroke="#b59bff" stroke-width="1.4" marker-end="url(#arr)"/><text x="408.33333333333337" y="492" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">11. tool result</text><line x1="490.0" y1="540" x2="326.6666666666667" y2="540" stroke="#b59bff" stroke-width="1.4" marker-end="url(#arr)"/><text x="408.33333333333337" y="534" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">12. final text</text><line x1="326.6666666666667" y1="582" x2="163.33333333333334" y2="582" stroke="#b59bff" stroke-width="1.4" marker-end="url(#arr)"/><text x="245.0" y="576" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">13. answer</text></svg>
