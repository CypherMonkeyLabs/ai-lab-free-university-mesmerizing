<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 666" role="img" aria-labelledby="t d">
<title id="t">One tool call over MCP</title>
<desc id="d">Initialize, list tools, model calls, host executes, model answers.</desc>
<rect width="980" height="666" fill="#0e131b"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#b59bff"/></marker></defs><text x="163.33333333333334" y="36" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">User</text><line x1="163.33333333333334" y1="48" x2="163.33333333333334" y2="646" stroke="#2c3544"/><text x="326.6666666666667" y="36" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Host</text><line x1="326.6666666666667" y1="48" x2="326.6666666666667" y2="646" stroke="#2c3544"/><text x="490.0" y="36" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Model</text><line x1="490.0" y1="48" x2="490.0" y2="646" stroke="#2c3544"/><text x="653.3333333333334" y="36" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">MCP client</text><line x1="653.3333333333334" y1="48" x2="653.3333333333334" y2="646" stroke="#2c3544"/><text x="816.6666666666667" y="36" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">MCP server</text><line x1="816.6666666666667" y1="48" x2="816.6666666666667" y2="646" stroke="#2c3544"/><line x1="653.3333333333334" y1="78" x2="816.6666666666667" y2="78" stroke="#b59bff" stroke-width="1.4" marker-end="url(#arr)"/><text x="735.0" y="72" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">1. initialize, negotiate</text><line x1="653.3333333333334" y1="120" x2="816.6666666666667" y2="120" stroke="#b59bff" stroke-width="1.4" marker-end="url(#arr)"/><text x="735.0" y="114" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">2. tools/list</text><line x1="816.6666666666667" y1="162" x2="653.3333333333334" y2="162" stroke="#b59bff" stroke-width="1.4" marker-end="url(#arr)"/><text x="7