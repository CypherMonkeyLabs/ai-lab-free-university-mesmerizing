<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 456" role="img" aria-labelledby="t d">
<title id="t">One completion, request to text</title>
<desc id="d">Who speaks at each step of a single generation call.</desc>
<rect width="980" height="456" fill="#0e131b"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4b15a"/></marker></defs><text x="163.33333333333334" y="36" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">App</text><line x1="163.33333333333334" y1="48" x2="163.33333333333334" y2="436" stroke="#2c3544"/><text x="326.6666666666667" y="36" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">API</text><line x1="326.6666666666667" y1="48" x2="326.6666666666667" y2="436" stroke="#2c3544"/><text x="490.0" y="36" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Tokenizer</text><line x1="490.0" y1="48" x2="490.0" y2="436" stroke="#2c3544"/><text x="653.3333333333334" y="36" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Network</text><line x1="653.3333333333334" y1="48" x2="653.3333333333334" y2="436" stroke="#2c3544"/><text x="816.6666666666667" y="36" text-anchor="middle" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Sampler</text><line x1="816.6666666666667" y1="48" x2="816.6666666666667" y2="436" stroke="#2c3544"/><line x1="163.33333333333334" y1="78" x2="326.6666666666667" y2="78" stroke="#e4b15a" stroke-width="1.4" marker-end="url(#arr)"/><text x="245.0" y="72" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">1. messages + sampling params</text><line x1="326.6666666666667" y1="120" x2="490.0" y2="120" stroke="#e4b15a" stroke-width="1.4" marker-end="url(#arr)"/><text x="408.33333333333337" y="114" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">2. encode the prompt</text><line x1="490.0" y1="162" x2="653.3333333333334" y2="162" stroke="#e4b15a" stroke-width="1.4" marker-end="url(#arr)"/><text x="571.6666666666667" y="156" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">3. token ids in</text><line x1="653.3333333333334" y1="204" x2="816.6666666666667" y2="204" stroke="#e4b15a" stroke-width="1.4" marker-end="url(#arr)"/><text x="735.0" y="198" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">4. logit vector after attention</text><line x1="816.6666666666667" y1="246" x2="653.3333333333334" y2="246" stroke="#e4b15a" stroke-width="1.4" marker-end="url(#arr)"/><text x="735.0" y="240" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">5. chosen id, repeat until stop</text><line x1="653.3333333333334" y1="288" x2="490.0" y2="288" stroke="#e4b15a" stroke-width="1.4" marker-end="url(#arr)"/><text x="571.6666666666667" y="282" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">6. ids out</text><line x1="490.0" y1="330" x2="326.6666666666667" y2="330" stroke="#e4b15a" stroke-width="1.4" marker-end="url(#arr)"/><text x="408.33333333333337" y="324" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">7. text</text><line x1="326.6666666666667" y1="372" x2="163.33333333333334" y2="372" stroke="#e4b15a" stroke-width="1.4" marker-end="url(#arr)"/><text x="245.0" y="366" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#c9d0da">8. message, usage, finish reason</text></svg>
