<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="t d">
<title id="t">Trusted instruction beside untrusted channels</title>
<desc id="d">The instruction, the caller, and retrieved or tool text all reach the model. The cap sits in the host, outside the prompt.</desc>
<rect width="1000" height="280" fill="#0e131b"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#5ec8d8"/></marker></defs>
<rect x="24" y="36" width="200" height="88" rx="12" fill="#171d27" stroke="#5ec8d8"/>
<text x="124" y="68" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Instructions</text>
<text x="124" y="92" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">trusted channel</text>
<rect x="24" y="156" width="200" height="88" rx="12" fill="#171d27" stroke="#d08a4c"/>
<text x="124" y="188" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Caller text</text>
<text x="124" y="212" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">untrusted</text>
<rect x="268" y="156" width="220" height="88" rx="12" fill="#171d27" stroke="#d08a4c"/>
<text x="378" y="188" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Article or tool result</text>
<text x="378" y="212" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">also untrusted</text>
<path d="M224 80 H300" stroke="#5ec8d8" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M224 200 H300" stroke="#d08a4c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M488 200 H540" stroke="#d08a4c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540" y="96" width="180" height="120" rx="12" fill="#171d27" stroke="#5ec8d8"/>
<text x="630" y="150" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Model</text>
<text x="630" y="174" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">proposal only</text>
<path d="M720 156 H760" stroke="#5ec8d8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="760" y="96" width="210" height="120" rx="12" fill="#171d27" stroke="#7dcea0"/>
<text x="865" y="142" text-anchor="middle" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" fill="#ebe6dc">Host cap</text>
<text x="865" y="166" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">outside the prompt</text>
<text x="865" y="188" text-anchor="middle" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif" fill="#9aa3b2">deny or execute</text>
</svg>
